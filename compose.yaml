services:
  search:
    image: ghcr.io/searxng/searxng@sha256:932f69dca010db9880bddebb2171f05d8e1a25d04a59149ff65409993d680024
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - search-data:/var/cache/searxng
    environment:
      SEARXNG_SECRET: ${SPENCER_SEARCH_SECRET:?Set SPENCER_SEARCH_SECRET to a random local value}
    restart: unless-stopped

volumes:
  search-data:
