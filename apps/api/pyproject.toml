[project]
name = "spencer-api"
version = "0.1.0"
description = "Local grocery receipt analysis for Spencer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20",
  "pdfplumber>=0.11,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "reportlab>=4", "ruff>=0.12", "mypy>=1.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spencer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*"]
ignore_missing_imports = true
